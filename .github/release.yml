# Categories for GitHub's generated release notes. Each merged pull request is listed once, under
# the first category whose label it carries. PRs are the unit of release notes: one PR, one line.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - docs
    - title: Internal
      labels:
        - ci
        - release
        - chore
    - title: Other changes
      labels:
        - "*"
