[package]
name = "merge-pipeline"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Merge git branches according to configurable release workflows, with MCP tooling and self-update built in."
authors = ["Christopher Vachon <code@christophervachon.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/CodeVachon/merge-pipeline"
homepage = "https://github.com/CodeVachon/merge-pipeline#readme"
keywords = ["git", "merge", "release", "cli", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "merge_pipeline"
path = "src/lib.rs"

[[bin]]
name = "merge-pipeline"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
dirs = "7.0.0"
flate2 = "1.1.10"
inquire = "0.9.4"
owo-colors = "4.4.0"
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
